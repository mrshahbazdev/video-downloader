<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All-in-One Video Downloader</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 720px;
      background: #1e293b;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    h1 { margin: 0 0 8px; font-size: 28px; color: #38bdf8; }
    p.subtitle { margin: 0 0 24px; color: #94a3b8; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    input, select, button {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 15px;
    }
    input { flex: 1; }
    button {
      background: #0ea5e9;
      border: none;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    button:hover { background: #0284c7; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { margin: 12px 0; padding: 12px; border-radius: 8px; background: #334155; }
    .error { background: #7f1d1d; color: #fecaca; }
    .success { background: #064e3b; color: #a7f3d0; }
    .info-card {
      display: none;
      background: #0f172a;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    .info-card img { width: 100%; border-radius: 10px; margin-bottom: 12px; }
    .info-card h2 { margin: 0 0 8px; font-size: 20px; }
    .info-card p { margin: 4px 0; color: #cbd5e1; }
    .formats { margin-top: 12px; }
    .formats label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    .download-row { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
    .download-link {
      display: inline-block;
      background: #10b981;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    .download-link:hover { background: #059669; }
    .disclaimer {
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>All-in-One Video Downloader</h1>
    <p class="subtitle">Paste a video URL from 20+ supported sites (YouTube, TikTok, Instagram, Twitter, Facebook, etc.)</p>

    <div class="row">
      <input type="text" id="url" placeholder="https://..." />
      <button id="infoBtn" onclick="fetchInfo()">Get Info</button>
    </div>

    <div id="message"></div>

    <div class="info-card" id="infoCard">
      <img id="thumb" src="" alt="thumbnail" />
      <h2 id="title"></h2>
      <p id="meta"></p>

      <div class="formats">
        <label for="formatSelect">Choose format:</label>
        <select id="formatSelect"></select>
      </div>

      <div class="download-row">
        <button id="downloadBtn" onclick="downloadVideo()">Download</button>
        <a class="download-link" id="downloadLink" style="display:none" href="#" target="_blank">Open file</a>
      </div>
    </div>

    <p class="disclaimer">
      Only download content you have rights to. Respect copyright and each platform's Terms of Service.
    </p>
  </div>

  <script>
    let currentUrl = '';
    let currentFormats = [];

    function showMessage(text, type = '') {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + (type || '');
    }

    async function fetchInfo() {
      const url = document.getElementById('url').value.trim();
      if (!url) return showMessage('Please enter a URL', 'error');

      currentUrl = url;
      const btn = document.getElementById('infoBtn');
      btn.disabled = true;
      showMessage('Fetching video info...');
      document.getElementById('infoCard').style.display = 'none';

      try {
        const res = await fetch('/api/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');

        currentFormats = data.formats || [];
        document.getElementById('title').textContent = data.title || 'Untitled';
        document.getElementById('thumb').src = data.thumbnail || '';
        document.getElementById('meta').textContent = [
          data.uploader ? `By ${data.uploader}` : '',
          data.duration ? `${formatTime(data.duration)}` : '',
          `${currentFormats.length} format(s) available`,
        ].filter(Boolean).join(' · ');

        const select = document.getElementById('formatSelect');
        select.innerHTML = '';
        const best = document.createElement('option');
        best.value = 'best';
        best.textContent = 'Best available';
        select.appendChild(best);

        currentFormats.forEach((f) => {
          const opt = document.createElement('option');
          opt.value = f.format_id;
          const size = f.filesize
            ? ` (${formatBytes(f.filesize)})`
            : f.filesize_approx
            ? ` (~${formatBytes(f.filesize_approx)})`
            : '';
          const label = [f.resolution, f.ext, f.vcodec, f.acodec ? `audio:${f.acodec}` : '']
            .filter(Boolean)
            .join(' | ');
          opt.textContent = `${label}${size}`;
          select.appendChild(opt);
        });

        document.getElementById('infoCard').style.display = 'block';
        document.getElementById('downloadLink').style.display = 'none';
        showMessage('');
      } catch (err) {
        showMessage(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function downloadVideo() {
      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      showMessage('Downloading...');
      document.getElementById('downloadLink').style.display = 'none';

      try {
        const formatId = document.getElementById('formatSelect').value;
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: currentUrl, formatId }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');

        const link = document.getElementById('downloadLink');
        link.href = data.downloadUrl;
        link.download = data.filename;
        link.textContent = `Download ${data.filename}`;
        link.style.display = 'inline-block';
        showMessage('Ready', 'success');
      } catch (err) {
        showMessage(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function formatTime(s) {
      if (!s) return '';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function formatBytes(b) {
      if (!b) return '';
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(b) / Math.log(1024));
      return `${(b / Math.pow(1024, i)).toFixed(1)} ${sizes[i]}`;
    }
  </script>
</body>
</html>
